<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the game fill the whole screen, under the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fixture — Tic Tac Toe</title>

  <!-- Make it launch fullscreen like an app when added to the home screen -->
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fixture" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Self-hosted brand fonts: Bebas Neue (display) + Inter (body) -->
  <link rel="stylesheet" href="fonts.css" />
  <style>
    /* ---------- Fixture design system (kept in sync with index.html) ---------- */
    :root {
      --pitch: #0b3d2e;             /* base */
      --pitch-dark: #072a20;        /* deeper end of the background gradient */
      --cream: #f2efe6;             /* all text */
      --gold: #c68a2e;              /* the single accent */
      --text-dark: #0b3d2e;         /* text sitting on top of gold or cream */

      --row-empty: rgba(255, 255, 255, 0.05);
      --row-solved: rgba(198, 138, 46, 0.14);
      --row-border: rgba(242, 239, 230, 0.16);

      --display: 'Bebas Neue', 'Arial Narrow', sans-serif;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    /* Lock the page to the screen: no scrolling, no rubber-band bounce. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--pitch-dark);   /* paints the safe-area regions green, not white */
    }
    body {
      margin: 0;
      position: fixed;
      inset: 0;
      font-family: var(--body);
      background: linear-gradient(160deg, var(--pitch), var(--pitch-dark));
      color: var(--cream);
      display: flex;
      justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) 14px max(8px, calc(env(safe-area-inset-bottom) - 20px));
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;   /* no double-tap zoom */
    }

    .game {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .badge {
      background: var(--gold);
      color: var(--text-dark);
      font-family: var(--body);
      font-weight: 800;
      letter-spacing: 1.2px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .timer {
      margin-left: auto;
      font-family: var(--display);
      font-variant-numeric: tabular-nums;
      font-size: 27px;
      line-height: 1;
      color: var(--gold);
      letter-spacing: 1px;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 2px 10px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--cream);
      cursor: pointer;
      padding: 4px 2px;
      display: flex;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn:active { opacity: 0.55; }

    /* ---------- The grid: a header row of clubs, then three rows ---------- */
    /* Fixed-height rows keep the squares square-ish; the leftover screen
       height is absorbed below the grid (see .tries margin-bottom). */
    .grid {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 78px 1fr 1fr 1fr;
      grid-template-rows: auto repeat(3, 92px);
      gap: 6px;
      margin: auto 0 8px;   /* with .tries below, this centres the block */
    }

    /* the empty square in the top-left corner */
    .corner { }

    /* club names across the top, nationalities down the side */
    .head {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.2px;
      color: rgba(242, 239, 230, 0.8);
      padding: 6px 2px;
      min-height: 40px;
    }
    /* long country names (Netherlands) wrap rather than getting clipped */
    .head.side {
      font-size: 9px;
      letter-spacing: 0.2px;
      line-height: 1.2;
      text-transform: uppercase;
      color: rgba(242, 239, 230, 0.7);
      padding: 4px 0;
    }

    /* ---------- A playable square ---------- */
    .cell {
      background: var(--row-empty);
      border: 1.5px solid var(--row-border);
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    /* the square you're currently answering */
    .cell.active { border-color: var(--gold); background: rgba(198, 138, 46, 0.1); }
    /* a square you've filled in */
    .cell.filled {
      background: var(--row-solved);
      border-color: var(--gold);
      cursor: default;
      animation: pop 0.3s ease;
    }
    @keyframes pop {
      0% { transform: scale(0.9); }
      60% { transform: scale(1.03); }
      100% { transform: scale(1.0); }
    }
    .cell-name {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--cream);
    }
    /* how many people would have given that answer — lower is rarer */
    .cell-rarity {
      font-family: var(--display);
      font-weight: 400;
      font-size: 16px;
      line-height: 1;
      color: var(--gold);
    }
    /* a faint plus sign marks an empty square */
    .cell-empty { font-size: 18px; color: rgba(242, 239, 230, 0.2); font-weight: 300; }

    /* ---------- Guesses left ---------- */
    .tries {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: auto;   /* soaks up the spare height above the keyboard */
      padding: 0 4px 10px;
    }
    .pips { display: flex; gap: 5px; }
    .pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      transition: border-color 0.2s ease, opacity 0.2s ease;
    }
    .pip.used { border-color: rgba(242, 239, 230, 0.25); opacity: 0.6; }
    .tries-label {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: rgba(242, 239, 230, 0.55);
    }

    /* ---------- Search box + dropdown ---------- */
    .search-wrap { position: relative; flex: 0 0 auto; }

    .query {
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      background: var(--cream);
      border-radius: 12px;
      display: flex;
      align-items: center;
      color: var(--text-dark);
      font-size: 17px;
      font-weight: 700;
      user-select: none;
    }
    .qtext { white-space: nowrap; overflow: hidden; text-transform: uppercase; }
    .qtext:empty::before { content: attr(data-hint); color: #8b9490; font-weight: 500; text-transform: none; }
    .caret {
      width: 2px; height: 20px;
      background: var(--pitch);
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }
    .qtext:empty + .caret { display: none; }
    @keyframes blink { 50% { opacity: 0; } }

    .query.wrong { animation: shake 0.4s ease, redfade 2.5s ease forwards; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    @keyframes redfade {
      0%, 55% { box-shadow: 0 0 0 3px #e5484d; }
      100% { box-shadow: 0 0 0 3px rgba(229, 72, 77, 0); }
    }

    .dropdown {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--cream);
      border-radius: 12px;
      overflow: hidden;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 8px);      /* sit just above the search box */
      z-index: 50;
      box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.28);
    }
    .dropdown.show { display: block; }
    .dropdown li {
      padding: 13px 16px;
      color: var(--text-dark);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid rgba(11, 61, 46, 0.09);
    }
    .dropdown li:last-child { border-bottom: none; }
    .dropdown li:hover, .dropdown li.active { background: rgba(198, 138, 46, 0.16); }
    .dropdown .empty { color: #8b9490; font-weight: 500; cursor: default; }
    .dropdown li.spent { color: #8b9490; text-decoration: line-through; }

    /* ---------- Built-in on-screen keyboard ---------- */
    .keyboard {
      flex: 0 0 auto;
      margin-top: 10px;
      padding: 0 3px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      user-select: none;
    }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .kb-row.indent { padding: 0 5%; }
    .key {
      flex: 1;
      text-align: center;
      background: var(--cream);
      color: var(--text-dark);
      border-radius: 9px;
      padding: 16px 0;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 1.5px 0 rgba(0, 0, 0, 0.3);
      transition: background 0.08s ease, transform 0.08s ease;
    }
    .key:active { background: var(--gold); transform: scale(0.92); }
    .key.special { font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .key.special:active { background: var(--gold); transform: scale(0.95); }
    .key.wide { flex: 1.5; }
    .key.spacebar { flex: 1.5; }
    .key.icon { display: flex; align-items: center; justify-content: center; }

    /* ---------- Finish pop-up (modal) ---------- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(7, 42, 32, 0.78);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.show { display: flex; }

    .modal {
      background: var(--cream);
      color: var(--text-dark);
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      padding: 26px 22px;
      text-align: center;
      animation: pop 0.35s ease;
    }
    .modal h2 {
      margin: 0 0 4px;
      font-size: 32px;
      font-family: var(--display);
      font-weight: 400;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .modal .note { font-size: 13px; color: rgba(11, 61, 46, 0.7); margin: 0 0 18px; }
    .stats { display: flex; gap: 12px; }
    .stat {
      flex: 1;
      background: rgba(11, 61, 46, 0.06);
      border-radius: 14px;
      padding: 14px 8px;
    }
    .stat-num {
      display: block;
      font-family: var(--display);
      font-weight: 400;
      font-size: 34px;
      line-height: 1;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      display: block;
      margin-top: 5px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: rgba(11, 61, 46, 0.5);
    }
  </style>
</head>

      <span class="badge">Tic Tac Toe</span>

    <!-- Built-in keyboard — keys are built by the script below -->
    <div class="keyboard" id="keyboard"></div>

      { name: "Fernando Torres",     short: "Torres",    nat: "Spain", fame: 65, clubs: ["Chelsea", "Liverpool", "AC Milan"] },
      { name: "Juan Mata",           short: "Mata",      nat: "Spain", fame: 40, clubs: ["Chelsea", "Manchester United"] },
      { name: "César Azpilicueta",   short: "Azpilicueta", nat: "Spain", fame: 35, clubs: ["Chelsea"] },
      { name: "Cesc Fàbregas",       short: "Fàbregas",  nat: "Spain", fame: 60, clubs: ["Chelsea", "Arsenal", "Barcelona"] },
      { name: "Pepe Reina",          short: "Reina",     nat: "Spain", fame: 30, clubs: ["Liverpool", "AC Milan", "Barcelona"] },
      { name: "Luis García",         short: "L. García", nat: "Spain", fame: 18, clubs: ["Liverpool", "Barcelona"] },
      { name: "Santi Cazorla",       short: "Cazorla",   nat: "Spain", fame: 30, clubs: ["Arsenal"] },
      { name: "Mikel Arteta",        short: "Arteta",    nat: "Spain", fame: 40, clubs: ["Arsenal"] },
      { name: "Nacho Monreal",       short: "Monreal",   nat: "Spain", fame: 15, clubs: ["Arsenal"] },
      { name: "Álvaro Morata",       short: "Morata",    nat: "Spain", fame: 45, clubs: ["Juventus", "Chelsea", "Real Madrid", "AC Milan"] },
      { name: "Fernando Llorente",   short: "Llorente",  nat: "Spain", fame: 20, clubs: ["Juventus"] },

      // ---- Netherlands ----
      { name: "Johan Cruyff",        short: "Cruyff",    nat: "Netherlands", fame: 55, clubs: ["Barcelona"] },
      { name: "Patrick Kluivert",    short: "Kluivert",  nat: "Netherlands", fame: 35, clubs: ["Barcelona", "AC Milan"] },
      { name: "Marc Overmars",       short: "Overmars",  nat: "Netherlands", fame: 25, clubs: ["Barcelona", "Arsenal"] },
      { name: "Frenkie de Jong",     short: "De Jong",   nat: "Netherlands", fame: 45, clubs: ["Barcelona"] },
      { name: "Memphis Depay",       short: "Depay",     nat: "Netherlands", fame: 40, clubs: ["Barcelona", "Manchester United"] },
      { name: "Arjen Robben",        short: "Robben",    nat: "Netherlands", fame: 65, clubs: ["Bayern Munich", "Chelsea", "Real Madrid"] },
      { name: "Mark van Bommel",     short: "Van Bommel", nat: "Netherlands", fame: 20, clubs: ["Bayern Munich", "Barcelona", "AC Milan"] },
      { name: "Roy Makaay",          short: "Makaay",    nat: "Netherlands", fame: 18, clubs: ["Bayern Munich"] },
      { name: "Nathan Aké",          short: "Aké",       nat: "Netherlands", fame: 25, clubs: ["Chelsea"] },
      { name: "Winston Bogarde",     short: "Bogarde",   nat: "Netherlands", fame: 8,  clubs: ["Chelsea", "Barcelona"] },
      { name: "Virgil van Dijk",     short: "Van Dijk",  nat: "Netherlands", fame: 70, clubs: ["Liverpool"] },
      { name: "Dennis Bergkamp",     short: "Bergkamp",  nat: "Netherlands", fame: 55, clubs: ["Arsenal", "Inter Milan"] },
      { name: "Clarence Seedorf",    short: "Seedorf",   nat: "Netherlands", fame: 40, clubs: ["AC Milan", "Real Madrid", "Inter Milan"] },
      { name: "Edgar Davids",        short: "Davids",    nat: "Netherlands", fame: 30, clubs: ["Juventus", "AC Milan", "Barcelona"] },

      // ---- Italy ----
      { name: "Alessandro Del Piero", short: "Del Piero", nat: "Italy", fame: 55, clubs: ["Juventus"] },
      { name: "Gianluigi Buffon",     short: "Buffon",    nat: "Italy", fame: 70, clubs: ["Juventus"] },
      { name: "Giorgio Chiellini",    short: "Chiellini", nat: "Italy", fame: 50, clubs: ["Juventus"] },
      { name: "Leonardo Bonucci",     short: "Bonucci",   nat: "Italy", fame: 40, clubs: ["Juventus", "AC Milan"] },
      { name: "Andrea Pirlo",         short: "Pirlo",     nat: "Italy", fame: 65, clubs: ["Juventus", "AC Milan", "Inter Milan"] },
      { name: "Paolo Maldini",        short: "Maldini",   nat: "Italy", fame: 60, clubs: ["AC Milan"] },
      { name: "Mario Balotelli",      short: "Balotelli", nat: "Italy", fame: 45, clubs: ["Liverpool", "AC Milan", "Inter Milan"] },
      { name: "Alberto Aquilani",     short: "Aquilani",  nat: "Italy", fame: 10, clubs: ["Liverpool", "AC Milan", "Juventus"] },
      { name: "Jorginho",             short: "Jorginho",  nat: "Italy", fame: 40, clubs: ["Arsenal", "Chelsea"] },
      { name: "Vito Mannone",         short: "Mannone",   nat: "Italy", fame: 6,  clubs: ["Arsenal"] },
      { name: "Antonio Conte",        short: "Conte",     nat: "Italy", fame: 35, clubs: ["Juventus"] },
    ];

    // =========================================================
    //  THE GRIDS — three clubs across, three nationalities down.
    //  Every square has at least one answer in the list above.
    // =========================================================
    const GRIDS = [
      { clubs: ["Real Madrid", "Manchester United", "AC Milan"], nats: ["Brazil", "France", "England"] },
      { clubs: ["Barcelona", "Bayern Munich", "Chelsea"],        nats: ["Brazil", "Spain", "Netherlands"] },
      { clubs: ["Liverpool", "Arsenal", "Juventus"],             nats: ["France", "Spain", "Italy"] },
    ];

    // ---- Pick TODAY's grid (same one all day, a new one tomorrow) ----
    function dayNumber() {
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const epoch = Date.UTC(2026, 0, 1);          // counting starts 1 Jan 2026
      return Math.floor((today - epoch) / 86400000);
    }
    const GRID = GRIDS[((dayNumber() % GRIDS.length) + GRIDS.length) % GRIDS.length];

    const DATABASE = PLAYERS.slice().sort((a, b) => a.name.localeCompare(b.name));
    const MAX_GUESSES = 9;

    // ---- Grab the parts of the page we'll update ----
    const gridEl      = document.getElementById("grid");
    const pipsEl      = document.getElementById("pips");
    const triesLabel  = document.getElementById("triesLabel");
    const timerEl     = document.getElementById("timer");
    const queryEl     = document.getElementById("query");
    const qtextEl     = document.getElementById("qtext");
    const keyboardEl  = document.getElementById("keyboard");
    const dropdownEl  = document.getElementById("dropdown");
    const overlayEl   = document.getElementById("overlay");

    let query = "";
    let used;          // guesses spent
    let filled;        // { "r,c": player } for every square answered
    let usedNames;     // names already placed, so nobody is used twice
    let active;        // the square currently being answered, e.g. "0,2"
    let startTime;
    let tickHandle;
    let finished;

    function normalise(text) {
      return text
        .toLowerCase()
        .trim()
        .normalize("NFD")                 // splits accented letters apart
        .replace(/[̀-ͯ]/g, ""); // removes the accent marks
    }

    function matchesQuery(name, q) {
      return normalise(name)
        .split(/\s+/)
        .some((word) => word.startsWith(q));
    }

    function format(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
      return m + ":" + s;
    }

    // Does this player satisfy the square at row r, column c?
    function isValid(player, r, c) {
      return player.nat === GRID.nats[r] && player.clubs.includes(GRID.clubs[c]);
    }

    // ---- Build the grid: header row, then three rows of three ----
    function buildGrid() {
      gridEl.innerHTML = "";

      const corner = document.createElement("div");
      corner.className = "corner";
      gridEl.appendChild(corner);

      GRID.clubs.forEach((club) => {
        const h = document.createElement("div");
        h.className = "head";
        h.textContent = club;
        gridEl.appendChild(h);
      });

      GRID.nats.forEach((nat, r) => {
        const h = document.createElement("div");
        h.className = "head side";
        h.textContent = nat;
        gridEl.appendChild(h);

        GRID.clubs.forEach((club, c) => {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.id = "cell-" + r + "-" + c;
          cell.innerHTML = '<span class="cell-empty">+</span>';
          cell.addEventListener("click", () => selectCell(r, c));
          gridEl.appendChild(cell);
        });
      });
    }

    function buildPips() {
      pipsEl.innerHTML = "";
      for (let i = 0; i < MAX_GUESSES; i++) {
        const pip = document.createElement("span");
        pip.className = "pip";
        pip.id = "pip-" + i;
        pipsEl.appendChild(pip);
      }
    }
    function renderTries() {
      for (let i = 0; i < MAX_GUESSES; i++) {
        document.getElementById("pip-" + i).classList.toggle("used", i < used);
      }
      const left = MAX_GUESSES - used;
      triesLabel.textContent = left === 1 ? "1 guess left" : left + " guesses left";
    }

    // Choose which square you're answering.
    function selectCell(r, c) {
      if (finished || filled["" + r + "," + c]) return;
      active = r + "," + c;
      document.querySelectorAll(".cell").forEach((el) => el.classList.remove("active"));
      document.getElementById("cell-" + r + "-" + c).classList.add("active");
      updateHint();
    }

    // The placeholder text in the search bar names the square you're on.
    function updateHint() {
      if (!active) { qtextEl.setAttribute("data-hint", "Pick a square, then name a player…"); return; }
      const [r, c] = active.split(",").map(Number);
      qtextEl.setAttribute("data-hint", GRID.nats[r] + " · " + GRID.clubs[c]);
    }

    // Move on to the first square that's still empty.
    function selectNextEmpty() {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          if (!filled["" + r + "," + c]) { selectCell(r, c); return; }
        }
      }
      active = null;
      updateHint();
    }

    let wrongTimer;
    function flashWrong() {
      clearTimeout(wrongTimer);
      queryEl.classList.remove("wrong");
      void queryEl.offsetWidth;      // restart the animation if it's mid-shake
      queryEl.classList.add("wrong");
      wrongTimer = setTimeout(() => queryEl.classList.remove("wrong"), 2500);
    }

    function renderQuery() {
      qtextEl.textContent = query;
      renderDropdown();
    }

    function renderDropdown() {
      const q = normalise(query);
      dropdownEl.innerHTML = "";

      if (!q || finished) { dropdownEl.classList.remove("show"); return; }

      const matches = DATABASE.filter((p) => matchesQuery(p.name, q));

      if (matches.length === 0) {
        dropdownEl.innerHTML = '<li class="empty">No players found</li>';
      } else {
        matches.slice(0, 6).forEach((p) => {
          const li = document.createElement("li");
          li.textContent = p.name;
          if (usedNames.has(p.name)) li.classList.add("spent");
          li.addEventListener("click", () => pickPlayer(p));
          dropdownEl.appendChild(li);
        });
      }
      dropdownEl.classList.add("show");
    }

    // ---- Build the on-screen keyboard ----
    const KEY_ROWS = [
      ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"],
      ["a", "s", "d", "f", "g", "h", "j", "k", "l"],
      ["space", "z", "x", "c", "v", "b", "n", "m", "del"],
    ];
    function buildKeyboard() {
      keyboardEl.innerHTML = "";
      KEY_ROWS.forEach((row, i) => {
        const rowEl = document.createElement("div");
        rowEl.className = "kb-row";
        if (i === 1) rowEl.classList.add("indent");
        row.forEach((k) => {
          const key = document.createElement("div");
          key.className = "key";
          if (k === "del") {
            key.classList.add("special", "wide", "icon");
            key.setAttribute("aria-label", "Delete");
            key.innerHTML = '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H10L4 12l6 6h10a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><line x1="14" y1="10" x2="18" y2="14"/><line x1="18" y1="10" x2="14" y2="14"/></svg>';
          }
          else if (k === "space") { key.classList.add("special", "spacebar"); key.textContent = "space"; }
          else { key.textContent = k; }
          key.addEventListener("pointerdown", (e) => { e.preventDefault(); pressKey(k); });
          rowEl.appendChild(key);
        });
        keyboardEl.appendChild(rowEl);
      });
    }
    function pressKey(k) {
      if (finished) return;
      if (k === "del") query = query.slice(0, -1);
      else if (k === "space") { if (query && !query.endsWith(" ")) query += " "; }
      else if (query.length < 24) query += k;
      renderQuery();
    }

    // The player picked a name for the active square.
    function pickPlayer(player) {
      if (finished || !active) return;

      // Someone already on the grid can't be reused — and it costs nothing.
      if (usedNames.has(player.name)) {
        flashWrong();
        query = "";
        renderQuery();
        return;
      }

      const [r, c] = active.split(",").map(Number);
      used++;
      renderTries();

      if (isValid(player, r, c)) {
        filled[active] = player;
        usedNames.add(player.name);
        const cell = document.getElementById("cell-" + r + "-" + c);
        cell.classList.remove("active");
        cell.classList.add("filled");
        cell.innerHTML =
          '<span class="cell-name">' + player.short + '</span>' +
          '<span class="cell-rarity">' + player.fame + '%</span>';
        selectNextEmpty();
      } else {
        flashWrong();          // wrong for this square — the guess is spent
      }

      query = "";
      renderQuery();

      const count = Object.keys(filled).length;
      if (used >= MAX_GUESSES || count === 9) finish(count);
    }

    function loop() {
      timerEl.textContent = format((performance.now() - startTime) / 1000);
    }

    function finish(count) {
      finished = true;
      clearInterval(tickHandle);
      timerEl.textContent = format((performance.now() - startTime) / 1000);

      document.querySelectorAll(".cell").forEach((el) => el.classList.remove("active"));
      query = "";
      qtextEl.textContent = "";
      dropdownEl.classList.remove("show");

      const picks = Object.values(filled);
      const avg = picks.length
        ? Math.round(picks.reduce((sum, p) => sum + p.fame, 0) / picks.length)
        : null;

      document.getElementById("resultTitle").textContent = count === 9 ? "Grid complete!" : "Out of guesses";
      document.getElementById("statFilled").textContent = count + "/9";
      document.getElementById("statRarity").textContent = avg === null ? "—" : avg + "%";

      // small pause so the player sees the last square fill before the pop-up
      setTimeout(() => overlayEl.classList.add("show"), 1200);
    }

    // ---- Set up the game (runs once when the page loads) ----
    used = 0;
    filled = {};
    usedNames = new Set();
    finished = false;

    buildGrid();
    buildPips();
    renderTries();
    selectNextEmpty();          // start on the top-left square

    startTime = performance.now();
    tickHandle = setInterval(loop, 100);

    buildKeyboard();
    renderQuery();
  </script>
