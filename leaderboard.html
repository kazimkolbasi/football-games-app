<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fixture — Leaderboards</title>

  <meta name="theme-color" content="#0b3d2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fixture" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="fixture.css" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--pitch-dark);
    }
    body {
      margin: 0;
      position: fixed;
      inset: 0;
      font-family: var(--body);
      background: linear-gradient(160deg, var(--pitch), var(--pitch-dark));
      color: var(--cream);
      display: flex;
      justify-content: center;
      padding: max(14px, env(safe-area-inset-top)) 16px calc(var(--tabbar) + env(safe-area-inset-bottom));
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .board {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    h1 {
      flex: 0 0 auto;
      font-family: var(--display);
      font-weight: 400;
      color: var(--gold);
      font-size: 38px;
      line-height: 1;
      letter-spacing: 0.5px;
      margin: 0 0 16px;
      text-transform: uppercase;
    }

    /* ---------- Global / Friends ---------- */
    .segment {
      flex: 0 0 auto;
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 14px;
    }
    .segment button {
      flex: 1;
      border: none;
      background: none;
      color: var(--muted);
      font-family: var(--body);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 9px 6px;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .segment button.on { background: var(--gold); color: var(--text-dark); }

    /* ---------- Day / Week / Month / All ---------- */
    .periods {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .periods button {
      flex: 1;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--muted);
      font-family: var(--body);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 2px 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.18s ease, border-color 0.18s ease;
    }
    .periods button.on { color: var(--cream); border-bottom-color: var(--gold); }

    .col-head {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      padding: 0 14px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .rows {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .rows::-webkit-scrollbar { display: none; }

    .note {
      flex: 0 0 auto;
      padding: 12px 4px 0;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="board">
    <h1>Leaderboards</h1>

    <!-- who you're ranked against -->
    <div class="segment" id="scopes"></div>

    <!-- over what stretch of time -->
    <div class="periods" id="periods"></div>

    <div class="col-head">
      <span id="headLeft">Today</span>
      <span id="headRight">Total time</span>
    </div>

    <div class="rows"><ol class="fx-lb" id="rows"></ol></div>

    <p class="note" id="note">Ranked by fastest time — lowest wins.</p>
  </main>

  <script src="fixture.js"></script>
  <script>
    var SCOPES  = [ { id: "friends", name: "Friends" }, { id: "global", name: "Global" } ];
    var PERIODS = [
      { id: "day",   name: "Day",   head: "Today",        label: "Total time" },
      { id: "week",  name: "Week",  head: "This week",    label: "Avg total" },
      { id: "month", name: "Month", head: "This month",   label: "Avg total" },
      { id: "all",   name: "All",   head: "Last 30 days", label: "Avg total" },
    ];

    // Strangers who only show up on the Global board.
    var STRANGERS = [
      { name: "arda_10",     initial: "A", colour: "#c05b5b" },
      { name: "futbolcu",    initial: "F", colour: "#5b7fc0" },
      { name: "kadikoy_kid", initial: "K", colour: "#9a7bd0" },
      { name: "no9",         initial: "N", colour: "#4f9d76" },
      { name: "trabzon61",   initial: "T", colour: "#c08a3e" },
      { name: "leyla.k",     initial: "L", colour: "#b5628f" },
      { name: "eflatun",     initial: "E", colour: "#6f6fb0" },
    ];

    var scope  = "friends";
    var period = "day";

    // A tiny repeatable random, so the same board always looks the same.
    function seeded(str) {
      var h = 1779033703 ^ str.length;
      for (var i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      };
    }

    // Roughly how long all five games take a decent player, in seconds.
    var PAR = 400;

    function buildRows() {
      // ---- Today: real. Your row is whatever you've actually played. ----
      if (period === "day") {
        var rows = Fixture.totals();
        if (scope === "global") {
          var rand = seeded("global-day");
          STRANGERS.forEach(function (s) {
            rows.push({
              name: s.name, initial: s.initial, colour: s.colour,
              seconds: Math.round(PAR * (0.75 + rand() * 0.7)),
              played: Fixture.GAMES.length, you: false,
            });
          });
          rows.sort(function (a, b) {
            var aDone = a.played === Fixture.GAMES.length, bDone = b.played === Fixture.GAMES.length;
            if (aDone !== bDone) return aDone ? -1 : 1;
            return a.seconds - b.seconds;
          });
        }
        return rows;
      }

      // ---- Longer periods: placeholders, since a session has no history ----
      var rand2 = seeded(scope + period);
      var spread = period === "week" ? 0.45 : 0.32;
      var people = Fixture.RIVALS.map(function (r) {
        return { name: r.name, initial: r.initial, colour: r.colour, you: false };
      });
      people.push({ name: "You", initial: "Y", colour: "#c68a2e", you: true });
      if (scope === "global") people = people.concat(STRANGERS.map(function (s) {
        return { name: s.name, initial: s.initial, colour: s.colour, you: false };
      }));

      return people
        .map(function (p) {
          p.seconds = Math.round(PAR * (0.78 + rand2() * spread));
          return p;
        })
        .sort(function (a, b) { return a.seconds - b.seconds; });
    }

    function renderControls() {
      var scopesEl = document.getElementById("scopes");
      scopesEl.innerHTML = "";
      SCOPES.forEach(function (s) {
        var b = document.createElement("button");
        b.textContent = s.name;
        if (s.id === scope) b.classList.add("on");
        b.addEventListener("click", function () { scope = s.id; render(); });
        scopesEl.appendChild(b);
      });

      var periodsEl = document.getElementById("periods");
      periodsEl.innerHTML = "";
      PERIODS.forEach(function (p) {
        var b = document.createElement("button");
        b.textContent = p.name;
        if (p.id === period) b.classList.add("on");
        b.addEventListener("click", function () { period = p.id; render(); });
        periodsEl.appendChild(b);
      });
    }

    function render() {
      renderControls();
      var p = PERIODS.filter(function (x) { return x.id === period; })[0];
      document.getElementById("headLeft").textContent = p.head;
      document.getElementById("headRight").textContent = p.label;

      Fixture.renderRows(document.getElementById("rows"), buildRows(), { showPlayed: period === "day" });

      document.getElementById("note").textContent = period === "day"
        ? "Ranked by total time across all five games. Finish all five to rank."
        : "Ranked by fastest average — placeholder standings until accounts exist.";
    }

    render();
    Fixture.renderTabBar('boards');
  </script>
</body>
</html>
