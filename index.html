<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the hub fill the whole screen, under the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fixture</title>

  <!-- Make it launch fullscreen like an app when added to the home screen -->
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fixture" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Self-hosted brand fonts: Bebas Neue (display) + Inter (body) -->
  <link rel="stylesheet" href="fonts.css" />
  <!-- Shared tokens, tab bar, end card, leaderboard rows -->
  <link rel="stylesheet" href="fixture.css" />
  <style>
    * { box-sizing: border-box; }

    /* Lock the page to the screen: no scrolling, no rubber-band bounce. */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--pitch-dark);   /* paints the safe-area regions green, not white */
    }
    body {
      margin: 0;
      position: fixed;
      inset: 0;
      font-family: var(--body);
      background: linear-gradient(160deg, var(--pitch), var(--pitch-dark));
      color: var(--cream);
      display: flex;
      justify-content: center;
      /* room for the tab bar at the bottom */
      padding: max(14px, env(safe-area-inset-top)) 16px calc(var(--tabbar) + env(safe-area-inset-bottom));
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;   /* no double-tap zoom */
    }

    .home {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ---------- Top: brand + date + streak ---------- */
    .home-head {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .brand {
      font-family: var(--display);
      font-weight: 400;            /* Bebas has one weight — never fake-bold it */
      color: var(--gold);
      font-size: 44px;
      line-height: 0.95;
      letter-spacing: 0.5px;
      margin: 0;
      text-transform: uppercase;
    }
    .date {
      margin: 6px 0 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .streak {
      flex: 0 0 auto;
      border: 1.5px solid var(--gold);
      border-radius: 16px;
      padding: 8px 16px;
      text-align: center;
      min-width: 72px;
    }
    .streak-num {
      display: block;
      font-family: var(--display);
      font-weight: 400;
      color: var(--gold);
      font-size: 30px;
      line-height: 1;
    }
    .streak-label {
      display: block;
      margin-top: 2px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Today's running total ---------- */
    .today {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }
    .today-num {
      font-family: var(--display);
      font-weight: 400;
      font-size: 38px;
      line-height: 0.9;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }
    .today-text { flex: 1 1 auto; min-width: 0; }
    .today-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .today-progress { display: flex; gap: 5px; margin-top: 7px; }
    .dot {
      width: 100%;
      max-width: 30px;
      height: 4px;
      border-radius: 999px;
      background: rgba(242, 239, 230, 0.16);
    }
    .dot.on { background: var(--gold); }

    /* ---------- Section label ---------- */
    .section-label {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 2px 10px;
    }

    /* ---------- Game cards ---------- */
    .games {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;              /* only scrolls on very small screens */
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .games::-webkit-scrollbar { display: none; }

    .game-card {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 17px 18px;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease;
    }
    .game-card:active { background: rgba(255, 255, 255, 0.09); }
    /* a game you've already finished today */
    .game-card.done { border-color: rgba(198, 138, 46, 0.5); }

    .gc-text { flex: 1 1 auto; min-width: 0; }
    .gc-name {
      font-family: var(--display);
      font-weight: 400;
      font-size: 22px;
      line-height: 1.05;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .gc-sub {
      margin-top: 4px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .play {
      flex: 0 0 auto;
      background: var(--gold);
      color: var(--text-dark);
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 12px;
      text-transform: uppercase;
      padding: 9px 20px;
      border-radius: 999px;
    }
    /* once played, the pill is replaced by your time */
    .result { flex: 0 0 auto; text-align: right; line-height: 1; }
    .result-time {
      font-family: var(--display);
      font-weight: 400;
      font-size: 26px;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .result-label {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="home-head">
      <div>
        <h1 class="brand">Fixture</h1>
        <p class="date" id="date">Today</p>
      </div>
      <div class="streak">
        <span class="streak-num">12</span>
        <span class="streak-label">Streak</span>
      </div>
    </header>

    <div class="today">
      <span class="today-num" id="todayTotal">—</span>
      <div class="today-text">
        <div class="today-label" id="todayLabel">Today's total</div>
        <div class="today-progress" id="todayProgress"></div>
      </div>
    </div>

    <div class="section-label">Today's Games</div>
    <section class="games" id="games"></section>
  </main>

  <script src="fixture.js"></script>
  <script>
    // Show today's real date, e.g. "Tuesday 28 July"
    (function () {
      var d = new Date();
      var day = d.toLocaleDateString('en-GB', { weekday: 'long' });
      var date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
      document.getElementById('date').textContent = day + ' ' + date;
    })();

    // Build the game list. A game you've finished shows your time instead
    // of a Play button — tapping it reopens that game's end card.
    (function () {
      var results = Fixture.getResults();
      var gamesEl = document.getElementById('games');
      var playedCount = 0;
      var total = 0;

      Fixture.GAMES.forEach(function (game) {
        var done = results[game.id];
        if (done) { playedCount++; total += done.seconds; }

        var card = document.createElement('a');
        card.className = 'game-card' + (done ? ' done' : '');
        card.href = game.file;
        card.innerHTML =
          '<div class="gc-text">' +
            '<div class="gc-name">' + game.name + '</div>' +
            '<div class="gc-sub">' + game.sub + '</div>' +
          '</div>' +
          (done
            ? '<span class="result"><span class="result-time">' + Fixture.formatTime(done.seconds) +
              '</span><span class="result-label">Done</span></span>'
            : '<span class="play">Play</span>');
        gamesEl.appendChild(card);
      });

      // The running total across whatever you've played so far
      document.getElementById('todayTotal').textContent =
        playedCount ? Fixture.formatTime(total) : '—';
      document.getElementById('todayLabel').textContent =
        playedCount === Fixture.GAMES.length
          ? "Today's total — all done"
          : "Today's total · " + playedCount + " of " + Fixture.GAMES.length;

      var prog = document.getElementById('todayProgress');
      Fixture.GAMES.forEach(function (game) {
        var dot = document.createElement('span');
        dot.className = 'dot' + (results[game.id] ? ' on' : '');
        prog.appendChild(dot);
      });
    })();

    Fixture.renderTabBar('play');
  </script>
</body>
</html>
